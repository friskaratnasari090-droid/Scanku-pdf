<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScanKu PDF - Pemindai Dokumen Pintar</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css)" />
  <style>
    @import url('[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap)');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <!-- Card Utama -->
  <div class="bg-white w-full max-w-md rounded-2xl shadow-lg border border-slate-100 p-6 sm:p-8">
    
    <!-- Header Logo -->
    <div class="flex items-center gap-2 mb-8">
      <div class="text-indigo-600 text-xl">
        <i class="fa-solid fa-file-invoice"></i>
      </div>
      <span class="font-bold text-xl text-indigo-900 tracking-tight">ScanKu</span>
      <span class="bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider">PDF</span>
    </div>

    <!-- Hero Icon -->
    <div class="flex justify-center mb-5">
      <div class="w-16 h-16 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 text-2xl">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>
    </div>

    <!-- Judul & Deskripsi -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900 mb-2">
        Pemindai Dokumen Pintar
      </h1>
      <p class="text-sm text-slate-500 leading-relaxed">
        Ubah dokumen fisik, catatan, atau kartu identitas Anda menjadi PDF berkualitas tinggi secara instan di browser.
      </p>
    </div>

    <!-- Tombol Aksi -->
    <div class="space-y-3 mb-8">
      <!-- Input file tersembunyi untuk kamera & galeri -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" />
      <input type="file" id="uploadInput" accept="image/*" multiple class="hidden" />

      <button 
        onclick="document.getElementById('cameraInput').click()"
        class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold text-sm shadow-md shadow-indigo-200 transition flex items-center justify-center gap-2.5 cursor-pointer">
        <i class="fa-solid fa-camera"></i>
        <span>Scan Kamera</span>
      </button>

      <button 
        onclick="document.getElementById('uploadInput').click()"
        class="w-full py-3.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-800 font-semibold text-sm transition flex items-center justify-center gap-2.5 cursor-pointer">
        <i class="fa-regular fa-image"></i>
        <span>Upload Gambar</span>
      </button>
    </div>

    <!-- Daftar Fitur -->
    <div class="border-t border-slate-100 pt-5 text-xs text-slate-500">
      <div class="flex flex-wrap justify-center gap-x-5 gap-y-2">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-check text-emerald-500"></i>
          <span>Deteksi & Filter Otomatis</span>
        </div>
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-check text-emerald-500"></i>
          <span>Multi-halaman & Atur Urutan</span>
        </div>
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-check text-emerald-500"></i>
          <span>100% Aman & Tanpa Server</span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
